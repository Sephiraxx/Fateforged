[package]
name = "fateforge-core"
version = "0.1.0"
edition = "2021"
publish = false
description = "Fateforge simulation core: team-4.0 battles, bit-identical to the JavaScript engine."
license = "MIT"

[lib]
path = "src/lib.rs"
# The WebAssembly build (src/wasm.rs) is made with `cargo rustc --crate-type cdylib` (scripts/build-rust-wasm.mjs),
# so the other targets keep a plain library build.

[[bin]]
name = "math-parity"
path = "src/bin/math_parity.rs"

[[bin]]
name = "team-state"
path = "src/bin/team_state.rs"

[[bin]]
name = "team-helpers"
path = "src/bin/team_helpers.rs"

[[bin]]
name = "team-calls"
path = "src/bin/team_calls.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
# float_roundtrip: exact number parsing; preserve_order: JavaScript key order in maps.
serde_json = { version = "1", features = ["float_roundtrip", "preserve_order"] }

[profile.release]
debug = false
lto = true
codegen-units = 1

[[bin]]
name = "team-games"
path = "src/bin/team_games.rs"
