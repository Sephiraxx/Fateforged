[package]
name = "fateforge-core"
version = "0.1.0"
edition = "2021"
publish = false
description = "Fateforge simulation core. Phase A: math that matches the browser's JavaScript bit for bit."
license = "MIT"

[lib]
path = "src/lib.rs"

[[bin]]
name = "math-parity"
path = "src/bin/math_parity.rs"

[[bin]]
name = "team-state"
path = "src/bin/team_state.rs"

[[bin]]
name = "team-helpers"
path = "src/bin/team_helpers.rs"

[[bin]]
name = "team-calls"
path = "src/bin/team_calls.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
# float_roundtrip: exact number parsing; preserve_order: JavaScript key order in maps.
serde_json = { version = "1", features = ["float_roundtrip", "preserve_order"] }

[profile.release]
debug = false
