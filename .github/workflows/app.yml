# Builds the Fateforge app: a Windows installer (.exe, .msi) and an Android .apk. The app wraps the offline Pages
# build (see DESKTOP-APP.md). Download the results from the workflow run's Artifacts.
name: App builds

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: Install game dependencies
        run: npm ci
      - name: Install the Tauri CLI
        run: npm ci
        working-directory: desktop
      - name: Build the installer
        run: npx tauri build
        working-directory: desktop
      - uses: actions/upload-artifact@v4
        with:
          name: fateforge-windows
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/fateforge.exe
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: 27.2.12479018
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          # The default also asks for the long-removed 'tools' package, which current SDK managers reject.
          packages: platform-tools
      - name: Install the Android NDK and platform
        run: sdkmanager "ndk;${NDK_VERSION}" "platforms;android-34" "build-tools;34.0.0"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: Install game dependencies
        run: npm ci
      - name: Install the Tauri CLI
        run: npm ci
        working-directory: desktop
      - name: Create the Android project
        run: npx tauri android init --ci
        working-directory: desktop
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/${{ env.NDK_VERSION }}
      - name: Build the APK (debug-signed, installable for testing)
        run: npx tauri android build --debug --apk --target aarch64
        working-directory: desktop
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/${{ env.NDK_VERSION }}
      - uses: actions/upload-artifact@v4
        with:
          name: fateforge-android
          path: desktop/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
